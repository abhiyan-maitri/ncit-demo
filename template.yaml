# =====================================================================
#  NCIT Workshop  ·  Serverless on AWS  ·  Starter template
#
#  This is the skeleton you'll build on top of.  One tiny "hello"
#  Lambda is wired up so you can confirm your tooling works.  Each
#  scenario below is a TODO: add the resources, hook up the events,
#  and write the handlers.
#
#  Day-to-day commands (see package.json):
#    npm install
#    npm run validate
#    npm run build
#    npm run deploy:guided    — first time
#    npm run deploy           — subsequent
#    npm run destroy          — clean up
# =====================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NCIT Workshop — starter (hello Lambda only; rest is yours to build)

Parameters:
  ProjectName:
    Type: String
    Default: ncit-demo

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:

  # ===================================================================
  #  STARTER  ·  Hello Lambda
  #    A tiny GET /hello endpoint so you can confirm your deploy works
  #    end-to-end before you start adding real resources.
  # ===================================================================

  HelloApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub ${ProjectName}-api

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-hello
      CodeUri: .
      Handler: functions/hello.handler
      Events:
        HelloRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HelloApi
            Method: GET
            Path: /hello
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        Format: cjs
        EntryPoints: [functions/hello.ts]
        External: ["@aws-sdk/*", "aws-sdk"]

  # ===================================================================
  #  SCENARIO 1  ·  Simple REST API
  #
  #  Build a small CRUD API for students:
  #     POST   /students
  #     GET    /students
  #     GET    /students/{id}
  #     DELETE /students/{id}
  #
  #  You'll need:
  #     - AWS::DynamoDB::Table  (PartitionKey: id, on-demand)
  #     - AWS::Serverless::HttpApi (or reuse HelloApi)
  #     - AWS::Serverless::Function with the 4 HttpApi event routes
  #     - IAM: DynamoDBCrudPolicy
  # ===================================================================

  # TODO: add Scenario 1 resources here


  # ===================================================================
  #  SCENARIO 2  ·  Analyze S3 CSV data
  #
  #  Upload a CSV to s3://<bucket>/raw/, get a JSON report at
  #  s3://<bucket>/reports/<name>.json.
  #
  #  You'll need:
  #     - AWS::S3::Bucket  (NotificationConfiguration → SQS)
  #     - AWS::SQS::Queue + DLQ + QueuePolicy
  #     - AWS::Serverless::Function (SQS-triggered)
  # ===================================================================

  # TODO: add Scenario 2 resources here


  # ===================================================================
  #  SCENARIO 3  ·  OCR a 1000-page PDF (fan-out architecture)
  #
  #     S3 incoming/* ─► OcrQueue ─► Splitter ─► OcrPageQueue ─► PageWorker ─► S3
  #                       (+DLQ)                  (+DLQ)
  #
  #  You'll need:
  #     - AWS::S3::Bucket
  #     - Two queues, two DLQs, two Lambdas
  #     - Splitter:    pdfjs-dist to count pages, fan-out per-page msgs
  #     - PageWorker:  pdfjs-dist for PDF pages, tesseract.js for images
  # ===================================================================

  # TODO: add Scenario 3 resources here


  # ===================================================================
  #  SCENARIO 4  ·  Scaling & retry demo
  #
  #     Producer Lambda ─► LoadQueue ─► Consumer Lambda
  #                         (+DLQ)      (ReportBatchItemFailures)
  #
  #  You'll need:
  #     - One queue + DLQ
  #     - Producer Lambda (CLI-invoked) that SendMessageBatch's N msgs
  #     - Consumer Lambda (SQS-triggered, batch 10) that returns
  #       batchItemFailures for the failures
  # ===================================================================

  # TODO: add Scenario 4 resources here


Outputs:
  HelloUrl:
    Description: Hit this to confirm the starter is live
    Value: !Sub https://${HelloApi}.execute-api.${AWS::Region}.amazonaws.com/hello
